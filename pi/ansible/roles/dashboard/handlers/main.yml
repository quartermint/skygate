---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart skygate-dashboard
  ansible.builtin.systemd:
    name: skygate-dashboard
    state: restarted
    daemon_reload: true

- name: Reload caddy
  ansible.builtin.command:
    cmd: caddy reload --config /etc/caddy/Caddyfile
  # a reload always applies config; tolerate caddy being down mid-provision
  changed_when: true
  failed_when: false

- name: Reload nftables
  ansible.builtin.systemd:
    name: nftables
    state: reloaded

name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # test-go runs `go test ./...`, which sweeps in cmd/proxy-server. That
      # package needs libwebp headers via CGo, so the build fails without them
      # even though `make build` itself excludes the proxy.
      - name: install system deps
        run: sudo apt-get update && sudo apt-get install -y libwebp-dev bats
      - name: build daemons
        run: make build
      - name: go tests
        run: make test-go
      - name: bats tests (nftables rules, CAKE rate convergence)
        run: make test-bats

      # lint-ansible skips silently when the tool is absent, so install it here
      # to make sure CI actually runs the lint rather than quietly passing.
      - name: install ansible-lint
        run: pipx install ansible-lint
      - name: ansible lint
        run: make lint-ansible
